[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# CC3 testnet block headers carry no mixHash/withdrawalsRoot/excessBlobGas, so the chain is
# pre-Shanghai. Targeting london keeps simulation working and avoids emitting cancun-only
# opcodes (mcopy, tstore) that this chain may not implement.
evm_version = "london"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
creditcoin = "https://rpc.cc3-testnet.creditcoin.network"
sepolia = "${SEPOLIA_RPC_URL}"
